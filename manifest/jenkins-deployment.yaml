apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-deployment
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk11
          ports:
            - containerPort: 8080
            - containerPort: 50000
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false"
            - name: JENKINS_OPTS
              value: "--httpPort=8080"
            - name: JENKINS_UC_EXPERIMENTAL
              value: "https://updates.jenkins.io"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: jenkins-plugins
              mountPath: /usr/share/jenkins/ref/plugins.txt
              subPath: plugins.txt
            - name: init-scripts
              mountPath: /usr/share/jenkins/ref/init.groovy.d/
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    if [ -f /usr/share/jenkins/ref/plugins.txt ]; then
                      /usr/local/bin/install-plugins.sh < /usr/share/jenkins/ref/plugins.txt
                    fi
      volumes:
        - name: jenkins-home
          emptyDir: {}
        - name: jenkins-plugins
          configMap:
            name: jenkins-plugins-config
        - name: init-scripts
          configMap:
            name: jenkins-init-config
