apiVersion: v1
kind: Service
metadata:
  name: jenkins-service
  namespace: jenkins
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/prometheus"
spec:
  selector:
    app: jenkins
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
